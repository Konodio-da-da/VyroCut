<script>
  (function initCapcutEffectsSheet() {
    const cards = document.querySelectorAll('.effect-card');
    const slider = document.getElementById('effect-slider');
    const sliderVal = document.getElementById('slider-val');
    const overlay = document.getElementById('effect-overlay');
    const playBtn = document.getElementById('play-btn');
    let isPlaying = false;

    // Card selection interaction
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.classList.remove('ring-2', 'ring-primary-container', 'shadow-md');
          const title = c.querySelector('span:last-child');
          if (title) {
            title.classList.remove('text-primary');
            title.classList.add('text-on-surface');
          }
          const tuneBadge = c.querySelector('.bg-primary-container');
          if (tuneBadge && !c.querySelector('.bg-tertiary-fixed')) {
            tuneBadge.remove();
          }
        });

        card.classList.add('ring-2', 'ring-primary-container', 'shadow-md');
        const title = card.querySelector('span:last-child');
        if (title) {
          title.classList.remove('text-on-surface');
          title.classList.add('text-primary');
        }

        const intensity = card.getAttribute('data-intensity') || '50';
        if (slider && sliderVal) {
          slider.value = intensity;
          sliderVal.textContent = intensity;
        }

        // Add tune indicator badge if not present
        const imgWrap = card.querySelector('.aspect-square');
        if (imgWrap && !imgWrap.querySelector('.material-symbols-outlined')) {
          const badge = document.createElement('div');
          badge.className = 'absolute bottom-1 right-1 w-5 h-5 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-md';
          badge.innerHTML = '<span class="material-symbols-outlined text-[14px]">tune</span>';
          imgWrap.appendChild(badge);
        }

        // Visual feedback on preview
        if (overlay) {
          overlay.style.opacity = (parseInt(intensity, 10) / 100).toString();
        }
      });
    });

    // Real-time parameter slider scrub
    if (slider && sliderVal && overlay) {
      slider.addEventListener('input', (e) => {
        const val = e.target.value;
        sliderVal.textContent = val;
        overlay.style.opacity = (parseInt(val, 10) / 100).toString();
      });
    }

    // Play/Pause toggler preview
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        const icon = playBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPlaying ? 'pause' : 'play_arrow';
        }
      });
    }
  })();
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.5)]"><div class="h-20 px-margin flex items-center gap-space-sm"><button class="flex-1 h-12 rounded-full bg-primary-container text-on-primary font-title-md text-title-md flex items-center justify-center gap-space-xs hover:brightness-95 active:scale-[0.99] transition-all shadow-[0_4px_16px_rgba(15,232,184,0.25)]"><span class="material-symbols-outlined text-[20px]">share</span><span>Share to TikTok</span></button><button class="h-12 w-12 rounded-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface flex items-center justify-center transition-colors shrink-0"><span class="material-symbols-outlined text-[20px]">more_horiz</span></button></div></div></body></html>
