name: Android build

on:
  pull_request:
    branches: [main, feat/android-foundation]
  push:
    branches: [main, fix/capcut-workflow-ui]
  workflow_dispatch:

permissions:
  contents: read

# The active editor feature branch also runs on push so every committed
# milestone is verifiable before review. PR events continue to validate the
# proposed changes against the target branch; newer runs supersede stale ones.
concurrency:
  group: android-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK and run unit tests
        run: gradle assembleDebug testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vyrocut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
